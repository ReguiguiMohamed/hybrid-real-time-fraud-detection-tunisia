name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/**"
      - "requirements.txt"
      - "README.md"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/deploy.yml"

concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API to Hugging Face Space
    if: github.repository == 'ReguiguiMohamed/hybrid-real-time-fraud-detection-tunisia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Push API files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set. Skipping deploy."
            echo "To enable: add HF_TOKEN to GitHub repo secrets (Settings > Secrets and variables > Actions)"
            exit 0
          fi

          SPACE_NAME="MohamedReg/amastan-fraud-shield-api"
          CLONE_DIR="hf-space"

          echo "Cloning current HF Space state..."
          git clone --depth=1 \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_NAME}" \
            "$CLONE_DIR"

          cd "$CLONE_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -rf --quiet . 2>/dev/null || true

          echo "Copying API files from source..."
          cp "$GITHUB_WORKSPACE/README.md" .
          cp "$GITHUB_WORKSPACE/Dockerfile" .
          cp "$GITHUB_WORKSPACE/.env.example" .
          cp "$GITHUB_WORKSPACE/requirements.txt" .
          cp -r "$GITHUB_WORKSPACE/dashboard" ./dashboard/
          cp -r "$GITHUB_WORKSPACE/src" ./src/

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          SOURCE_SHA=$(cd "$GITHUB_WORKSPACE" && git rev-parse --short HEAD)
          git commit -m "Deploy amastan-fraud-shield@${SOURCE_SHA}"

          echo "Pushing to Hugging Face Space..."
          git push origin main
