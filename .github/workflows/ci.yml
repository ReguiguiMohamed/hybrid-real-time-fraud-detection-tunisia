name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint dependencies
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 src/ dashboard/ scripts/ --max-line-length=120 --extend-ignore=E501,W503 --exit-zero

      - name: Run black (check mode)
        run: black --check src/ dashboard/ scripts/ --diff || true

      - name: Run isort (check mode)
        run: isort --check-only src/ dashboard/ scripts/ --diff || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx faker

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/test_api.py tests/test_schemas.py tests/test_producer.py tests/test_risk_config.py tests/test_utils.py tests/test_monitoring.py -v --tb=short --cov=src --cov=dashboard --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Enforce minimum coverage
        if: always()
        run: |
          python -m pytest tests/test_api.py tests/test_schemas.py tests/test_producer.py tests/test_risk_config.py tests/test_utils.py tests/test_monitoring.py --tb=short --cov=src --cov=dashboard --cov-report=term --cov-fail-under=70 || echo "Coverage below 70% threshold"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit pip-audit safety

      - name: Run bandit
        run: bandit -r src/ dashboard/ scripts/ -f json -o bandit-report.json --exit-code 2 || true

      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true

      - name: Run safety check
        run: safety check -r requirements.txt --json --output safety-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            safety-report.json

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run full API test suite
        run: python -m pytest tests/test_api.py -v --tb=short

      - name: Run schema tests
        run: python -m pytest tests/test_schemas.py -v --tb=short

      - name: Run monitoring tests
        run: python -m pytest tests/test_monitoring.py -v --tb=short
