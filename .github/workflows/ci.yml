name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  quality:
    name: Format and static correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install quality tools
        run: pip install black==24.10.0 flake8==7.1.1 isort==5.13.2

      - name: Check formatting
        run: black --check src dashboard scripts tests

      - name: Check import ordering
        run: isort --check-only src dashboard scripts tests

      - name: Check syntax and undefined names
        run: flake8 src dashboard scripts tests

      - name: Compile maintained Python modules
        run: python -m compileall -q src dashboard scripts

  verified-slice:
    name: Verified prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Run tests with enforced coverage
        run: |
          python -m pytest -p pytest_cov tests -m "not integration" \
            --cov=dashboard \
            --cov=shared \
            --cov=ml \
            --cov=compliance \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Regenerate OpenAPI snapshot
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- docs/openapi.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verified-slice-coverage
          path: coverage.xml

      - name: Generate deterministic backtest artifact
        run: python scripts/generate_backtest_artifact.py

      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backtest-report
          path: backtest-report.json
          if-no-files-found: warn

  security-gate:
    name: High-severity security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit==1.7.10

      - name: Fail on high-severity findings
        run: bandit -r src dashboard scripts -lll
