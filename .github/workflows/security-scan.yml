name: Weekly Security Report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Generate dependency report
        run: pip-audit --requirement requirements.txt --format json --output pip-audit-report.json

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

  static-analysis:
    name: Semgrep advisory report
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: returntocorp/semgrep:1.105.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Generate Semgrep report
        run: semgrep --config p/python --config p/security-audit --json --output semgrep-report.json src dashboard scripts

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
