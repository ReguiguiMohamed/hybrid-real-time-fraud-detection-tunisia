[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amastan-fraud-shield"
version = "0.1.0"
description = "Fraud alert review API for Tunisian digital payments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Mohamed Reguigui" },
]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
required-version = "24.10.0"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = [
  "compliance",
  "dashboard",
  "ml",
  "shared",
  "src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src", "dashboard"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
