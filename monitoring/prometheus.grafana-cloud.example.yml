# Optional collector path for Grafana Cloud.
# Preferred for the Hugging Face Space deployment: use Grafana Cloud's
# Metrics Endpoint integration to scrape https://<space>.hf.space/metrics.
# Use this file only if you run a Prometheus collector yourself and want
# remote_write into Grafana Cloud Metrics.
global:
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    project: "amastan-fraud-shield"
    environment: "production"
    runtime: "huggingface-space"

remote_write:
  - url: "https://<GRAFANA_CLOUD_PROMETHEUS_HOST>/api/prom/push"
    basic_auth:
      username: "<GRAFANA_CLOUD_METRICS_INSTANCE_ID>"
      password: "<GRAFANA_CLOUD_ACCESS_POLICY_TOKEN>"

scrape_configs:
  - job_name: "amastan-huggingface-api"
    scheme: "https"
    metrics_path: "/metrics"
    authorization:
      type: "Bearer"
      credentials: "<HUGGING_FACE_METRICS_TOKEN>"
    static_configs:
      - targets:
          - "<YOUR_SPACE_SUBDOMAIN>.hf.space"
        labels:
          service: "fraud-detection-command-center-api"
          verified_path: "fastapi_sqlalchemy_neon"
