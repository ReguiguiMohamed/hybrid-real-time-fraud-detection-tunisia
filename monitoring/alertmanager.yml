# Alertmanager Configuration
# Routes alerts to various notification channels
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST:-smtp.gmail.com:587}"
  smtp_from: "${SMTP_FROM:-amastan-alerts@company.com}"
  smtp_auth_username: "${SMTP_USER:-}"
  smtp_auth_password: "${SMTP_PASSWORD:-}"

route:
  group_by: ["alertname", "severity", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-notifications"
  routes:
    # Critical alerts go to PagerDuty/Slack immediately
    - match:
        severity: critical
      receiver: "pagerduty-critical"
      continue: true
      group_wait: 10s
      repeat_interval: 1h

    # Warnings go to email and Slack
    - match:
        severity: warning
      receiver: "slack-warnings"
      repeat_interval: 4h

receivers:
  - name: "email-notifications"
    email_configs:
      - to: "${ALERT_EMAIL:-fraud-team@company.com}"
        send_resolved: true

  - name: "pagerduty-critical"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY:-}"
        description: "{{ .CommonAnnotations.summary }}"

  - name: "slack-warnings"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-}"
        channel: "#fraud-alerts"
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true

inhibit_rules:
  # Suppress warning if critical is already firing for same alertname
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "component"]
