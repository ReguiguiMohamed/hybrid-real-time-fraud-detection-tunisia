# FastAPI Command Center with HPA
# Scales based on request rate and latency
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: amastan
  labels:
    app: fraud-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: amastan/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: api-token
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: admin-token
            - name: ANALYST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: analyst-token
            - name: PII_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: pii-salt
          volumeMounts:
            - name: feedback-db
              mountPath: /app/data
            - name: models
              mountPath: /app/models
          readinessProbe:
            httpGet:
              path: /health/
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: feedback-db
          persistentVolumeClaim:
            claimName: feedback-db-pvc
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: amastan
  labels:
    app: fraud-api
spec:
  type: ClusterIP
  selector:
    app: fraud-api
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-api-hpa
  namespace: amastan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-api-ingress
  namespace: amastan
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: fraud-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-api
                port:
                  number: 8001
---
# PVCs for API
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feedback-db-pvc
  namespace: amastan
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: amastan
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
