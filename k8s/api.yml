# FastAPI Command Center
# SQLite-backed deployment is intentionally single-replica until the alert
# store moves to PostgreSQL/CockroachDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: amastan
  labels:
    app: fraud-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: amastan/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: api-token
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: admin-token
            - name: ANALYST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: analyst-token
            - name: PII_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: pii-salt
          volumeMounts:
            - name: feedback-db
              mountPath: /app/data
            - name: models
              mountPath: /app/models
          readinessProbe:
            httpGet:
              path: /health/
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: feedback-db
          persistentVolumeClaim:
            claimName: feedback-db-pvc
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: amastan
  labels:
    app: fraud-api
spec:
  type: ClusterIP
  selector:
    app: fraud-api
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-api-ingress
  namespace: amastan
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fraud-api.example.com
      secretName: fraud-api-tls
  rules:
    - host: fraud-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-api
                port:
                  number: 8001
---
# PVCs for API
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feedback-db-pvc
  namespace: amastan
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: amastan
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
