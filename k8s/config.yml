# ConfigMap and Secrets for Amastan Fraud Shield Guard
# In production, use external-secrets-operator or HashiCorp Vault
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config
  namespace: amastan
data:
  uncertainty_zone: "0.4,0.6"
  random_sample_rate: "0.01"
  random_sample_max_prob: "0.1"
  thread_pool_size: "5"
  alert_async_timeout_seconds: "15"
  retrain_feedback_threshold: "100"
  dlq_retry_interval_seconds: "60"
  dlq_retry_max_attempts: "3"
  retrain_min_feedback: "100"
  champion_promotion_threshold: "0.02"
  drift_window_hours: "24"
  kafka_topic: "tunisian_transactions"
  pkyc_topic: "pkyc_triggers"
  shap_min_confidence_for_sar: "0.0"
  # Approximate 2026 Eid dates; update annually from an authoritative Tunisian calendar.
  tunisia_islamic_holidays: "2026-03-29,2026-03-30,2026-06-05,2026-06-06"
# Grafana Dashboard provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: amastan
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: amastan
        orgId: 1
        folder: Fraud Detection
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
