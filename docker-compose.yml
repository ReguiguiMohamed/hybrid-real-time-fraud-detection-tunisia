services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudnet

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fraudnet

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudnet

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fraudnet

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - API_TOKEN=${API_TOKEN:-default_dev_token}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-default_admin_token}
      - ANALYST_TOKEN=${ANALYST_TOKEN:-default_analyst_token}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/feedback.db}
      - RANDOM_SAMPLE_RATE=${RANDOM_SAMPLE_RATE:-0.01}
      - DLQ_RETRY_INTERVAL_SECONDS=${DLQ_RETRY_INTERVAL_SECONDS:-60}
      - DLQ_RETRY_MAX_ATTEMPTS=${DLQ_RETRY_MAX_ATTEMPTS:-3}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fraudnet

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - COMMAND_CENTER_API_URL=http://api:8001
      - COMMAND_CENTER_API_TOKEN=${API_TOKEN:-default_dev_token}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - fraudnet

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PKYC_TOPIC=${PKYC_TOPIC:-pkyc_triggers}
      - SANCTIONS_CSV_PATH=${SANCTIONS_CSV_PATH:-/app/data/sanctions/accounts.csv}
      - COMMAND_CENTER_API_URL=http://api:8001
      - COMMAND_CENTER_API_TOKEN=${API_TOKEN:-default_dev_token}
      - PYTHONPATH=/app/src
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure
    networks:
      - fraudnet

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PKYC_TOPIC=${PKYC_TOPIC:-pkyc_triggers}
      - SANCTIONS_CSV_PATH=${SANCTIONS_CSV_PATH:-/app/data/sanctions/accounts.csv}
      - COMMAND_CENTER_API_URL=http://api:8001
      - COMMAND_CENTER_API_VERSION=api/v1
      - COMMAND_CENTER_API_TOKEN=${API_TOKEN:-default_dev_token}
      - OLLAMA_URL=http://ollama:11434/api/generate
      - SAR_LLM_AUDIT_LOG=/app/data/audit/sar_llm_audit.jsonl
      - PYTHONPATH=/app/src
      - UNCERTAINTY_ZONE=${UNCERTAINTY_ZONE:-0.4,0.6}
      - RANDOM_SAMPLE_RATE=${RANDOM_SAMPLE_RATE:-0.01}
      - RANDOM_SAMPLE_MAX_PROB=${RANDOM_SAMPLE_MAX_PROB:-0.1}
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:-5}
      - ALERT_ASYNC_TIMEOUT_SECONDS=${ALERT_ASYNC_TIMEOUT_SECONDS:-15}
      - RETRAIN_FEEDBACK_THRESHOLD=${RETRAIN_FEEDBACK_THRESHOLD:-100}
      - DLQ_RETRY_INTERVAL_SECONDS=${DLQ_RETRY_INTERVAL_SECONDS:-60}
      - DLQ_RETRY_MAX_ATTEMPTS=${DLQ_RETRY_MAX_ATTEMPTS:-3}
      - SHAP_MIN_CONFIDENCE_FOR_SAR=${SHAP_MIN_CONFIDENCE_FOR_SAR:-0.0}
      - TUNISIA_ISLAMIC_HOLIDAYS=${TUNISIA_ISLAMIC_HOLIDAYS:-2026-03-29,2026-03-30,2026-06-05,2026-06-06}
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: on-failure
    networks:
      - fraudnet

volumes:
  chroma_data:
  ollama_data:

networks:
  fraudnet:
    driver: bridge
